<div class="auth-container">
    <div class="auth-card">
      <h2>Login</h2>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" [ngClass]="{'is-invalid': f['email'].invalid && f['email'].touched}">
          <div *ngIf="f['email'].invalid && f['email'].touched" class="invalid-feedback">
            <div *ngIf="f['email'].errors?.['required']">Email è obbligatoria.</div>
            <div *ngIf="f['email'].errors?.['email']">Email non valida.</div>
          </div>
        </div>
  
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" formControlName="password" [ngClass]="{'is-invalid': f['password'].invalid && f['password'].touched}">
          <div *ngIf="f['password'].invalid && f['password'].touched" class="invalid-feedback">
            Password is mandatory
          </div>
        </div>
  
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  
        <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">Login</button>
      </form>
      <p class="mt-3">No account? <a routerLink="/register">Register here</a></p>
    </div>
  </div>
