services:

  db:
    build:
      context: . 
      dockerfile: ./data_ingestion/Dockerfile.db 
    ports:
      - "5432:5432"
    container_name: postgres_dbvector      
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d # estensione vector

  data_ingestion: 
    build:
      context: . 
      dockerfile: ./data_ingestion/Dockerfile 
    container_name: data_ingestion
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      - db 

  ollama:
      image: ollama/ollama
      ports:
        - "11434:11434"
      container_name: ollama      
      volumes:
        - ollama_data:/root/.ollama
      entrypoint: >
        /bin/sh -c "ollama serve & sleep 5; ollama pull llama3; wait"

  backend: 
      build:
        context: .
        dockerfile: ./backend/Dockerfile
      ports: [ "8000:8000" ]
      container_name: backend      
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_HOST: ${POSTGRES_HOST}
        POSTGRES_PORT: ${POSTGRES_PORT}
        OLLAMA_BASE_URL: http://ollama:11434
        OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME}
      depends_on: [ db, ollama ]
      volumes:
        - ./backend:/app

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          API_URL: http://localhost:8000
      ports: [ "8080:80" ]
      container_name: frontend
      depends_on: [ backend ]
      volumes: []
      environment:
        - API_URL=http://backend:8000


volumes:
  db_data:
  ollama_data:
  ollama_models:

networks:
  default:
    name: ragnet
